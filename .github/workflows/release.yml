name: Release (manual)

# Normal releases are published by CI (tag-release job) using build artifacts.
# Use this only to re-publish assets for an existing tag without a new commit.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish (e.g. v2.3.5)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  republish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0

      - name: Install Blender 5.2 LTS
        run: |
          set -euo pipefail
          BLENDER_VERSION=5.2.0
          ARCHIVE="blender-${BLENDER_VERSION}-linux-x64.tar.xz"
          curl -fsSL "https://download.blender.org/release/Blender5.2/${ARCHIVE}" \
            -o "$RUNNER_TEMP/${ARCHIVE}"
          tar -xJf "$RUNNER_TEMP/${ARCHIVE}" -C "$RUNNER_TEMP"
          BLENDER_BIN="$(find "$RUNNER_TEMP" -maxdepth 3 -type f -name blender -executable | head -n 1)"
          if [[ -z "$BLENDER_BIN" ]]; then
            echo "error: blender binary not found after extract" >&2
            exit 1
          fi
          BLENDER_DIR="$(dirname "$BLENDER_BIN")"
          echo "$BLENDER_DIR" >> "$GITHUB_PATH"
          echo "BLENDER_BIN=$BLENDER_BIN" >> "$GITHUB_ENV"
          "$BLENDER_BIN" --version

      - name: Check tag matches manifest version
        run: |
          set -euo pipefail
          TAG="${{ inputs.tag }}"
          TAG="${TAG#v}"
          MANIFEST_VERSION="$(grep -E '^version\s*=' blender_manifest.toml | sed -E 's/^version\s*=\s*"([^"]+)".*/\1/')"
          if [[ "$TAG" != "$MANIFEST_VERSION" ]]; then
            echo "Tag v${TAG} does not match blender_manifest.toml version ${MANIFEST_VERSION}" >&2
            exit 1
          fi

      - name: Package release (extension + bundle)
        run: bash scripts/package-release.sh

      - name: Resolve artifact paths
        id: artifacts
        run: |
          set -euo pipefail
          EXT_ZIP="$(ls -1 export_3ds_tmf-*.zip | grep -v bundle | head -n 1)"
          BUNDLE_ZIP="$(ls -1 export_3ds_tmf-*-bundle.zip | head -n 1)"
          echo "ext_zip=$EXT_ZIP" >> "$GITHUB_OUTPUT"
          echo "bundle_zip=$BUNDLE_ZIP" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          files: |
            ${{ steps.artifacts.outputs.ext_zip }}
            ${{ steps.artifacts.outputs.bundle_zip }}
          generate_release_notes: true
          fail_on_unmatched_files: true
