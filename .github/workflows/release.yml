name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Blender 5.2 LTS
        run: |
          set -euo pipefail
          BLENDER_VERSION=5.2.0
          BLENDER_DIR="$RUNNER_TEMP/blender-${BLENDER_VERSION}-linux-x64"
          curl -fsSL "https://download.blender.org/release/Blender5.2/blender-${BLENDER_VERSION}-linux-x64.tar.xz" \
            | tar -xJ -C "$RUNNER_TEMP"
          echo "$BLENDER_DIR" >> "$GITHUB_PATH"
          blender --version

      - name: Validate extension manifest
        run: blender --command extension validate

      - name: Check tag matches manifest version
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#v}"
          MANIFEST_VERSION="$(grep -E '^version\s*=' blender_manifest.toml | sed -E 's/^version\s*=\s*"([^"]+)".*/\1/')"
          if [[ "$TAG" != "$MANIFEST_VERSION" ]]; then
            echo "Tag v${TAG} does not match blender_manifest.toml version ${MANIFEST_VERSION}" >&2
            echo "Bump blender_manifest.toml, commit, then tag v${MANIFEST_VERSION}." >&2
            exit 1
          fi
          echo "Version OK: ${MANIFEST_VERSION}"

      - name: Build extension zip
        run: blender --command extension build

      - name: Resolve zip path
        id: zip
        run: |
          set -euo pipefail
          ZIP="$(ls -1 export_3ds_tmf-*.zip | head -n 1)"
          echo "path=$ZIP" >> "$GITHUB_OUTPUT"
          echo "Release asset: $ZIP"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.zip.outputs.path }}
            base-tmf-scene.blend
          generate_release_notes: true
          fail_on_unmatched_files: true
