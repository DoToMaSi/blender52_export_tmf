name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Blender 5.2 LTS
        run: |
          set -euo pipefail
          BLENDER_VERSION=5.2.0
          BLENDER_DIR="$RUNNER_TEMP/blender-${BLENDER_VERSION}-linux-x64"
          curl -fsSL "https://download.blender.org/release/Blender5.2/blender-${BLENDER_VERSION}-linux-x64.tar.xz" \
            | tar -xJ -C "$RUNNER_TEMP"
          echo "$BLENDER_DIR" >> "$GITHUB_PATH"
          blender --version

      - name: Check tag matches manifest version
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#v}"
          MANIFEST_VERSION="$(grep -E '^version\s*=' blender_manifest.toml | sed -E 's/^version\s*=\s*"([^"]+)".*/\1/')"
          if [[ "$TAG" != "$MANIFEST_VERSION" ]]; then
            echo "Tag v${TAG} does not match blender_manifest.toml version ${MANIFEST_VERSION}" >&2
            exit 1
          fi
          echo "Version OK: ${MANIFEST_VERSION}"

      - name: Package release (extension + bundle)
        run: bash scripts/package-release.sh

      - name: Resolve artifact paths
        id: artifacts
        run: |
          set -euo pipefail
          EXT_ZIP="$(ls -1 export_3ds_tmf-*.zip | grep -v bundle | head -n 1)"
          BUNDLE_ZIP="$(ls -1 export_3ds_tmf-*-bundle.zip | head -n 1)"
          echo "ext_zip=$EXT_ZIP" >> "$GITHUB_OUTPUT"
          echo "bundle_zip=$BUNDLE_ZIP" >> "$GITHUB_OUTPUT"
          echo "Extension: $EXT_ZIP"
          echo "Bundle: $BUNDLE_ZIP"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.artifacts.outputs.ext_zip }}
            ${{ steps.artifacts.outputs.bundle_zip }}
          generate_release_notes: true
          fail_on_unmatched_files: true
