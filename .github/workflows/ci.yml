name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Blender 5.2 LTS
        run: |
          set -euo pipefail
          BLENDER_VERSION=5.2.0
          ARCHIVE="blender-${BLENDER_VERSION}-linux-x64.tar.xz"
          curl -fsSL "https://download.blender.org/release/Blender5.2/${ARCHIVE}" \
            -o "$RUNNER_TEMP/${ARCHIVE}"
          tar -xJf "$RUNNER_TEMP/${ARCHIVE}" -C "$RUNNER_TEMP"
          BLENDER_BIN="$(find "$RUNNER_TEMP" -maxdepth 3 -type f -name blender -executable | head -n 1)"
          if [[ -z "$BLENDER_BIN" ]]; then
            echo "error: blender binary not found after extract" >&2
            find "$RUNNER_TEMP" -maxdepth 3 -type f | head -50 >&2
            exit 1
          fi
          BLENDER_DIR="$(dirname "$BLENDER_BIN")"
          echo "$BLENDER_DIR" >> "$GITHUB_PATH"
          echo "BLENDER_BIN=$BLENDER_BIN" >> "$GITHUB_ENV"
          "$BLENDER_BIN" --version

      - name: Package release (extension + bundle)
        run: bash scripts/package-release.sh

      - name: Verify bundle structure
        id: artifacts
        run: |
          set -euo pipefail
          BUNDLE="$(ls -1 export_3ds_tmf-*-bundle.zip | head -n 1)"
          EXT="$(ls -1 export_3ds_tmf-*.zip | grep -v bundle | head -n 1)"
          unzip -l "$BUNDLE" | grep -E 'template/base-tmf-scene\.blend|script/export_3ds_tmf|README\.MD|TUTORIAL\.MD'
          if unzip -l "$EXT" | grep -qi 'base-tmf-scene'; then
            echo "error: extension zip must not contain base-tmf-scene.blend" >&2
            exit 1
          fi
          echo "ext_zip=$EXT" >> "$GITHUB_OUTPUT"
          echo "bundle_zip=$BUNDLE" >> "$GITHUB_OUTPUT"

      - name: Upload extension artifact
        uses: actions/upload-artifact@v4
        with:
          name: export_3ds_tmf-extension
          path: ${{ steps.artifacts.outputs.ext_zip }}
          if-no-files-found: error

      - name: Upload bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: export_3ds_tmf-bundle
          path: ${{ steps.artifacts.outputs.bundle_zip }}
          if-no-files-found: error

  tag-release:
    needs: validate-and-build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version and tag
        id: version
        run: |
          set -euo pipefail
          VERSION="$(grep -E '^version\s*=' blender_manifest.toml | sed -E 's/^version\s*=\s*"([^"]+)".*/\1/')"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Create release tag if missing
        run: |
          set -euo pipefail
          TAG="${{ steps.version.outputs.tag }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag ${TAG} already exists — continuing to publish release assets"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release ${TAG}"
          git push origin "$TAG"
          echo "Created and pushed ${TAG}"

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: export_3ds_tmf-*
          path: release-assets
          merge-multiple: true

      - name: List release assets
        run: ls -la release-assets/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Release ${{ steps.version.outputs.tag }}
          files: release-assets/*
          generate_release_notes: true
          fail_on_unmatched_files: true
