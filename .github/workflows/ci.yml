name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Blender 5.2 LTS
        run: |
          set -euo pipefail
          BLENDER_VERSION=5.2.0
          BLENDER_DIR="$RUNNER_TEMP/blender-${BLENDER_VERSION}-linux-x64"
          curl -fsSL "https://download.blender.org/release/Blender5.2/blender-${BLENDER_VERSION}-linux-x64.tar.xz" \
            | tar -xJ -C "$RUNNER_TEMP"
          echo "$BLENDER_DIR" >> "$GITHUB_PATH"
          blender --version

      - name: Package release (extension + bundle)
        run: bash scripts/package-release.sh

      - name: Verify bundle structure
        run: |
          set -euo pipefail
          BUNDLE="$(ls -1 export_3ds_tmf-*-bundle.zip | head -n 1)"
          EXT="$(ls -1 export_3ds_tmf-*.zip | grep -v bundle | head -n 1)"
          unzip -l "$BUNDLE" | grep -E 'template/base-tmf-scene\.blend|script/export_3ds_tmf|README\.MD|TUTORIAL\.MD'
          if unzip -l "$EXT" | grep -qi 'base-tmf-scene'; then
            echo "error: extension zip must not contain base-tmf-scene.blend" >&2
            exit 1
          fi

      - name: Upload extension artifact
        uses: actions/upload-artifact@v4
        with:
          name: export_3ds_tmf-extension
          path: export_3ds_tmf-*.zip
          if-no-files-found: error

      - name: Upload bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: export_3ds_tmf-bundle
          path: export_3ds_tmf-*-bundle.zip
          if-no-files-found: error
